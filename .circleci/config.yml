version: 2.1

jobs:
  test:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Run Maven tests
          command: mvn -B test

  build-staging:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            docker build . -t pablosaraiva/web:latest
            echo "$DOCKERHUB_PASS" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            docker push pablosaraiva/web:latest

  build-prod:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            docker build . -t pablosaraiva/web:stable
            echo "$DOCKERHUB_PASS" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            docker push pablosaraiva/web:stable

workflows:
  build-master:
    jobs:
      - test:
          filters:
            branches:
              only: master
      - build-prod:
          requires:
            - test
          filters:
            branches:
              only: master

  build-develop:
    jobs:
      - test:
          filters:
            branches:
              only: develop
      - build-staging:
          requires:
            - test
          filters:
            branches:
              only: develop